<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#efede8" />
    <title>TheXilliX — Кто он?</title>
    <link rel="preload" href="./assets/ghost.webp" as="image" type="image/webp" />

          <div class="eye-haze"></div>

        <div class="arrow" aria-hidden="true">
          <span class="arrow-line"></span>
          <span class="arrow-head"></span>

      <section class="menu-placeholder" id="menu" aria-label="Навигация" hidden>

          <nav class="nav-links" aria-label="Разделы сайта">
            <a class="nav-link" href="#about">Обо мне</a>
            <a class="nav-link" href="#now">Сейчас</a>
            <a class="nav-link" href="#photos">Фотографии</a>
            <a class="nav-link" href="#inspiration">Вдохновение</a>
            <a class="nav-link" href="#projects">Мои проекты</a>
            <a class="nav-link" href="#contacts">Контакты</a>
          </nav>
        </div>
        <div class="grain" aria-hidden="true"></div>

    <script src="./app.js" defer></script>
