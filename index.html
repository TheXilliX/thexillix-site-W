<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efede8" />
    <title>TheXilliX — Кто он?</title>
    <link rel="preload" href="./assets/ghost.webp" as="image" type="image/webp" />
    <link rel="preload" href="./assets/eye.webp" as="image" type="image/webp" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="site-shell" aria-live="polite">
      <section class="intro" id="intro" aria-label="Заставка Кто он?">
        <div class="paper" aria-hidden="true"></div>
        <div class="ghost ghost-a" aria-hidden="true"></div>
        <div class="ghost ghost-b" aria-hidden="true"></div>

        <div class="brand">TheXilliX</div>

        <div class="title-wrap" aria-label="Кто он?">
          <div class="title-line title-line-1">КТО</div>
          <div class="title-line title-line-2">ОН?</div>
        </div>

        <div class="eye-frame" aria-hidden="true">
          <div class="eye-photo"></div>
          <div class="eye-haze"></div>
        </div>

        <div class="arrow" aria-hidden="true">
          <span class="arrow-line"></span>
          <span class="arrow-head"></span>
        </div>

        <div class="grain" aria-hidden="true"></div>
      </section>

      <section class="menu-placeholder" id="menu" aria-label="Будущее меню" hidden>
        <div class="placeholder-inner">
          <div class="placeholder-brand">TheXilliX</div>
          <div class="placeholder-rule"></div>
          <p>ЗДЕСЬ БУДЕТ МЕНЮ</p>
        </div>
        <div class="grain" aria-hidden="true"></div>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
